# Render blueprint for the DevBrain backend (free tier).
# Create a new "Blueprint" in Render pointed at this repo; it reads this file.
services:
  - type: web
    name: devbrain-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      # Secrets — set these in the Render dashboard (sync: false keeps them out of git).
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      # Set to your deployed frontend origin (comma-separated for multiple).
      - key: CORS_ORIGINS
        sync: false
